<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>시스템 연결 중…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,"Segoe UI","Malgun Gothic",sans-serif; background:#f6f7f9; color:#111827; }
  .box { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:2rem 2.2rem;
         max-width:420px; text-align:center; box-shadow:0 4px 12px rgba(16,24,40,.06); }
  h1 { font-size:1.1rem; margin:0 0 .6rem; }
  p { margin:.3rem 0; color:#6b7280; font-size:.9rem; line-height:1.6; }
  a { color:#4f46e5; font-weight:600; }
  .spin { width:28px; height:28px; margin:0 auto 1rem; border:3px solid #e5e7eb; border-top-color:#4f46e5;
          border-radius:50%; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spin"></div>
  <h1>시스템에 연결하는 중입니다…</h1>
  <p>잠시만 기다려 주세요.</p>
</div>
<script>
// 이 링크는 고정 주소 역할만 한다. 실제 시스템 주소(임시 터널)는 켤 때마다 바뀌므로,
// 시스템을 켤 때 자동으로 갱신되는 target.json을 읽어 그 주소로 넘겨준다.
// GitHub Pages는 약 10분 캐시하므로 매번 새로 받아오도록 쿼리를 붙인다.
(async () => {
  const box = document.getElementById('box');
  try {
    const res = await fetch('target.json?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    if (data.status === 'online' && data.url) {
      location.replace(data.url);
      return;
    }
    box.innerHTML = '<h1>현재 시스템이 꺼져 있습니다</h1>' +
      '<p>담당자가 시스템을 켜면 이 주소로 다시 접속하실 수 있습니다.</p>' +
      (data.updated_at ? '<p style="font-size:.8rem">마지막 갱신: ' + data.updated_at + '</p>' : '');
  } catch (e) {
    box.innerHTML = '<h1>연결 정보를 불러오지 못했습니다</h1><p>잠시 후 새로고침해 주세요.</p>';
  }
})();
</script>
</body>
</html>
